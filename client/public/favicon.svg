<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .chip-bg {
        fill: #111113;
        stroke: rgba(255, 255, 255, 0.2);
        stroke-width: 2.5px;
      }
      .chip-text {
        fill: #F5F5F5;
        font-family: Consolas, "Courier Prime", -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -1px;
      }
      @media (prefers-color-scheme: light) {
        .chip-bg {
          fill: #F4F4F5;
          stroke: rgba(0, 0, 0, 0.2);
        }
        .chip-text {
          fill: #111113;
        }
      }
    </style>
  </defs>

  <!-- Developer Chip Container matching Navbar SF element -->
  <rect x="2" y="2" width="60" height="60" rx="10" class="chip-bg" />

  <!-- Bold Monospaced SF Glyph centered -->
  <text x="32" y="34.5" text-anchor="middle" dominant-baseline="central" class="chip-text">SF</text>
</svg>
