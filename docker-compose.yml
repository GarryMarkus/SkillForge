version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: skillforge_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillforge_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: skillforge_worker
    command: celery -A skillforge worker -l info
    volumes:
      - ./server:/app
    environment:
      - DJANGO_DEBUG=True
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./server/.env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: skillforge_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
